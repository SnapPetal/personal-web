spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dbmaster
    username: dbmasteruser
    password:

  liquibase:
    url: jdbc:postgresql://localhost:5432/dbmaster
    user: dbmasteruser
    password:
    contexts: dev

  # DevTools configuration for hot reload
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/resources
    livereload:
      enabled: true

notification:
  email:
    enabled: false

calendar:
  nextcloud:
    enabled: false

skatetricks:
  vectorstore:
    enabled: false

PERSONAL_AWS_ACCESS_KEY_ID: ${PERSONAL_AWS_ACCESS_KEY_ID:test}
PERSONAL_AWS_SECRET_ACCESS_KEY: ${PERSONAL_AWS_SECRET_ACCESS_KEY:test}
PERSONAL_AWS_REGION: ${PERSONAL_AWS_REGION:us-east-1}

posthog:
  enabled: ${PERSONAL_POSTHOG_ENABLED:false}
