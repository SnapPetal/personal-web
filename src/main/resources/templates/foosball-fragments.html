<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">

<!-- Shared Foosball subpage header -->
<div th:fragment="subpageHeader(title, icon, backLabel)"
     class="foosball-header py-3 border-bottom bg-light">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <h4 class="mb-0">
                <i th:class="${icon}" aria-hidden="true"></i>
                <span th:text="${title}">Foosball</span>
            </h4>
            <a th:href="@{/foosball}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i>
                <span th:text="${backLabel}">Back to Foosball</span>
            </a>
        </div>
    </div>
</div>

<!-- Player Statistics List Fragment -->
<div th:fragment="playerStatsList" class="skeleton-loading">
    <div th:if="${#lists.isEmpty(playerStats)}"
         class="text-center text-muted py-4 foosball-empty-state">
        <i class="bi bi-graph-up display-4"></i>
        <p class="mt-2">No player statistics available yet.</p>
        <button class="btn btn-outline-primary btn-sm"
                hx-get="/foosball/fragments/player-stats"
                hx-target="#playerStatsList">
            <i class="bi bi-arrow-clockwise"></i> Refresh Stats
        </button>
    </div>
    
    <div th:unless="${#lists.isEmpty(playerStats)}"
         class="table-responsive">
        <table class="table table-sm foosball-table">
            <thead>
                <tr>
                    <th><i class="bi bi-person"></i> Player</th>
                    <th><i class="bi bi-star"></i> Rating</th>
                    <th><i class="bi bi-graph-up-arrow"></i> Peak</th>
                    <th><i class="bi bi-fire"></i> Streak</th>
                    <th><i class="bi bi-controller"></i> Games</th>
                    <th><i class="bi bi-trophy"></i> Wins</th>
                    <th><i class="bi bi-percent"></i> Win Rate</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="stat : ${playerStats}" th:attr="data-player-name=${stat.playerName}">
                    <td><strong class="foosball-player-name" th:text="${stat.playerName}"></strong></td>
                    <td>
                        <span class="badge bg-warning text-dark" th:text="${stat.rating != null ? stat.rating : 1000}"></span>
                    </td>
                    <td>
                        <span class="badge bg-secondary" th:text="${stat.peakRating != null ? stat.peakRating : '-'}"></span>
                    </td>
                    <td>
                        <span th:if="${stat.currentStreak != null and stat.currentStreak > 0}"
                              class="badge bg-success"
                              th:text="'+' + ${stat.currentStreak}"></span>
                        <span th:if="${stat.currentStreak != null and stat.currentStreak < 0}"
                              class="badge bg-danger"
                              th:text="${stat.currentStreak}"></span>
                        <span th:if="${stat.currentStreak == null or stat.currentStreak == 0}"
                              class="text-secondary">-</span>
                    </td>
                    <td><span class="badge bg-info text-dark" th:text="${stat.totalGames}"></span></td>
                    <td><span class="badge bg-success" th:text="${stat.wins}"></span></td>
                    <td>
                        <span th:if="${stat.totalGames > 0}"
                              th:text="${#numbers.formatDecimal(stat.winPercentage, 0, 0)} + '%'"></span>
                        <span th:unless="${stat.totalGames > 0}" class="text-secondary">-</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Games List Fragment -->
<div th:fragment="gamesList" id="gamesList">
    <div th:if="${#lists.isEmpty(games)}" class="text-center text-muted py-4">
        <i class="bi bi-trophy display-4"></i>
        <p class="mt-2">No games recorded yet. Record your first game!</p>
    </div>
    
    <div th:unless="${#lists.isEmpty(games)}" class="table-responsive">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Team 1</th>
                    <th>Score</th>
                    <th>Team 2</th>
                    <th>Winner</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="game : ${games}">
                    <td th:text="${#temporals.format(game.gameDate, 'MMM dd, yyyy HH:mm')}"></td>
                    <td>
                        <span th:if="${game.team1Players != null and !#lists.isEmpty(game.team1Players)}"
                              th:text="${#strings.listJoin(game.team1Players.![name], ', ')}"></span>
                        <span th:unless="${game.team1Players != null and !#lists.isEmpty(game.team1Players)}">Team 1</span>
                    </td>
                    <td>
                        <span class="badge bg-primary" th:text="${game.team1Score ?: 0}"></span>
                        <span class="text-muted">-</span>
                        <span class="badge bg-secondary" th:text="${game.team2Score ?: 0}"></span>
                    </td>
                    <td>
                        <span th:if="${game.team2Players != null and !#lists.isEmpty(game.team2Players)}"
                              th:text="${#strings.listJoin(game.team2Players.![name], ', ')}"></span>
                        <span th:unless="${game.team2Players != null and !#lists.isEmpty(game.team2Players)}">Team 2</span>
                    </td>
                    <td>
                        <span class="badge bg-success" th:text="${game.winner ?: 'N/A'}"></span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Player Options Fragment -->
<th:block th:fragment="playerOptions">
    <option value="">Select Player...</option>
    <option th:each="player : ${players}"
            th:value="${player.name}"
            th:text="${player.name}"
            th:attr="data-id=${player.id}">
    </option>
</th:block>

<!-- Success Alert Fragment -->
<div th:fragment="successAlert"
     th:if="${successMessage}"
     class="alert alert-success alert-dismissible fade show"
     role="alert">
    <i class="bi bi-check-circle"></i>
    <span th:text="${successMessage}">Success!</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<!-- Error Alert Fragment -->
<div th:fragment="errorAlert"
     th:if="${errorMessage}"
     class="alert alert-danger alert-dismissible fade show"
     role="alert">
    <i class="bi bi-exclamation-circle"></i>
    <span th:text="${errorMessage}">Error!</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<!-- Combined Alert Fragment -->
<div th:fragment="alert">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<!-- HTMX 4 multi-target response for player creation -->
<th:block th:fragment="playerUpdate">
    <hx-partial hx-target="#main-alerts" hx-swap="innerHTML">
        <div th:replace="~{foosball-fragments :: alert}"></div>
    </hx-partial>
    <hx-partial th:if="${success}" hx-target="#player-table-container" hx-swap="innerMorph">
        <div th:replace="~{foosball-players :: playerTable}"></div>
    </hx-partial>
</th:block>

<!-- HTMX 4 multi-target response for game creation -->
<th:block th:fragment="gameUpdate">
    <hx-partial hx-target="#main-alerts" hx-swap="innerHTML">
        <div th:replace="~{foosball-fragments :: alert}"></div>
    </hx-partial>
    <hx-partial th:if="${success}" hx-target="#playerStatsList" hx-swap="innerMorph">
        <div th:replace="~{foosball-fragments :: playerStatsList}"></div>
    </hx-partial>
    <hx-partial th:if="${success}" hx-target="#gamesList" hx-swap="innerMorph">
        <div th:replace="~{foosball-fragments :: gamesList}"></div>
    </hx-partial>
</th:block>

<!-- Last Game Teams Fragment -->
<div th:fragment="lastGameTeams">
    <script type="text/javascript" th:inline="javascript">
        (function() {
            const lastGameTeams = {
                whitePlayer1: /*[[${whiteTeamPlayer1}]]*/ null,
                whitePlayer2: /*[[${whiteTeamPlayer2}]]*/ null,
                blackPlayer1: /*[[${blackTeamPlayer1}]]*/ null,
                blackPlayer2: /*[[${blackTeamPlayer2}]]*/ null
            };

            // Store globally so it persists
            window.lastGameTeamsData = lastGameTeams;

            console.log('Last game teams loaded:', lastGameTeams);
        })();
    </script>
</div>

</html>
