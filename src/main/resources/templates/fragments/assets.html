<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="posthogScripts">
        <script th:if="${@postHogProperties.browserConfigured}" th:inline="javascript">
            window.personalPostHogConfig = {
                projectToken: /*[[${@postHogProperties.projectToken}]]*/ '',
                apiHost: /*[[${@postHogProperties.apiHost}]]*/ 'https://e.thonbecker.biz',
                uiHost: 'https://us.posthog.com'
            };
        </script>
        <script th:if="${@postHogProperties.browserConfigured}" defer th:src="@{/js/posthog.js}"></script>
    </th:block>
    <th:block th:fragment="bootstrapCss">
        <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
        <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
    </th:block>

    <th:block th:fragment="htmxScripts">
        <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
        <script th:src="@{/webjars/htmx.org/dist/ext/hx-alpine-compat.min.js}"></script>
        <script th:src="@{/webjars/htmx.org/dist/ext/hx-browser-indicator.min.js}"></script>
        <script th:src="@{/webjars/htmx.org/dist/ext/hx-preload.min.js}"></script>
        <script th:src="@{/webjars/htmx.org/dist/ext/hx-history-cache.min.js}"></script>
        <script th:src="@{/webjars/personal-design-system/1.0.0/js/htmx-extensions.js}"></script>
        <script th:src="@{/webjars/personal-design-system/1.0.0/js/csrf-utils.js}"></script>
    </th:block>

    <th:block th:fragment="alpineScripts">
        <script defer th:src="@{/webjars/alpinejs/dist/cdn.min.js}"></script>
    </th:block>

    <th:block th:fragment="bootstrapScripts">
        <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    </th:block>

    <th:block th:fragment="favicons">
        <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
        <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
        <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
        <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
        <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}">
        <link rel="manifest" th:href="@{/site.webmanifest}">
        <meta name="theme-color" content="#1f3f77">
    </th:block>
</head>
</html>
