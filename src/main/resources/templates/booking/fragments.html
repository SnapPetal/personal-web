<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="navigation(page)" class="site-header">
    <a class="brand" href="https://thonbecker.biz">
        <img alt="" class="brand-mark brand-mark-light" height="28" th:src="@{/images/brand/b-transparent.svg}" width="28">
        <img alt="" class="brand-mark brand-mark-dark" height="28" th:src="@{/images/brand/b-transparent-dark.svg}" width="28">
        Thon Becker
    </a>
    <button aria-controls="primary-navigation" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" data-menu-toggle type="button">
        <span aria-hidden="true">☰</span> Menu
    </button>
    <nav aria-label="Primary navigation" id="primary-navigation">
        <a class="site-nav-link" href="https://thonbecker.biz">Home</a>
        <a class="site-nav-link" th:attr="aria-current=${page == 'booking' ? 'page' : null}" th:href="@{/booking}" hx-boost="true" hx-preload="mouseenter">Book a meeting</a>
        <a class="site-nav-link" th:if="${page == 'admin'}" th:href="@{/booking}" hx-boost="true" hx-preload="mouseenter">Public booking page</a>
        <span class="booking-admin-label" th:if="${page == 'admin'}">Administrator</span>
    </nav>
</header>

<!-- Time Slots Fragment -->
<div th:fragment="time-slots">
    <div th:if="${slots != null and !slots.isEmpty()}" class="d-grid gap-2">
        <button th:each="slot : ${slots}"
                type="button"
                class="btn btn-outline-primary time-slot-btn"
                onclick="selectTimeSlot(this)"
                th:attr="data-start-time=${slot.startTime()}"
                th:text="${#temporals.format(slot.startTime(), 'h:mm a')}">
            Time Slot
        </button>
    </div>
    <div th:if="${error == null and (slots == null or slots.isEmpty())}" class="alert alert-info">
        <i class="bi bi-info-circle"></i>
        No available time slots for this date. Please select another date.
    </div>
    <th:block th:if="${error != null and (slots == null or slots.isEmpty())}">
        <div th:replace="~{fragments/htmx :: error(${error}, ${retryUrl}, '#timeSlots')}"></div>
    </th:block>
</div>
</body>
</html>
