<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="navigation(page)" class="booking-site-header">
    <div class="booking-header-inner">
        <a class="booking-brand" href="https://thonbecker.biz">Thon Becker</a>
        <button aria-controls="booking-navigation" aria-expanded="false" aria-label="Toggle navigation"
                class="booking-menu-toggle navbar-toggler"
                data-bs-target="#booking-navigation" data-bs-toggle="collapse" type="button">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse booking-navigation" id="booking-navigation">
            <nav aria-label="Primary navigation" class="booking-primary-nav">
                <a href="https://thonbecker.biz">Home</a>
                <a aria-current="page" th:href="@{/booking}" hx-boost="true" hx-preload="mouseenter">Book a meeting</a>
                <a th:if="${page == 'admin'}" th:href="@{/booking}" hx-boost="true" hx-preload="mouseenter">Public booking page</a>
                <span class="booking-admin-label" th:if="${page == 'admin'}">Administrator</span>
                <button aria-label="Toggle dark mode" class="booking-theme-toggle" type="button"
                        x-data="themeToggle()" x-on:click="toggle()" x-bind:aria-label="isDark ? 'Use light mode' : 'Use dark mode'">
                    <i aria-hidden="true" x-bind:class="iconClass"></i>
                </button>
            </nav>
        </div>
    </div>
</header>

<!-- Time Slots Fragment -->
<div th:fragment="time-slots">
    <div th:if="${slots != null and !slots.isEmpty()}" class="d-grid gap-2">
        <button th:each="slot : ${slots}"
                type="button"
                class="btn btn-outline-primary time-slot-btn"
                onclick="selectTimeSlot(this)"
                th:attr="data-start-time=${slot.startTime()}"
                th:text="${#temporals.format(slot.startTime(), 'h:mm a')}">
            Time Slot
        </button>
    </div>
    <div th:if="${error == null and (slots == null or slots.isEmpty())}" class="alert alert-info">
        <i class="bi bi-info-circle"></i>
        No available time slots for this date. Please select another date.
    </div>
    <th:block th:if="${error != null and (slots == null or slots.isEmpty())}">
        <div th:replace="~{fragments/htmx :: error(${error}, ${retryUrl}, '#timeSlots')}"></div>
    </th:block>
</div>
</body>
</html>
