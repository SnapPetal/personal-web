name: Pull Request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-godot:
    name: Lint GDScript
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install GDScript tooling
        run: python -m pip install --requirement requirements-godot.txt

      - name: Run GDScript lint and format checks
        run: scripts/lint-godot.sh

  export-godot:
    name: Export Godot tank game
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    env:
      GODOT_VERSION: 4.7.2

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
            ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Validate GDScript with Godot
        run: scripts/validate-godot.sh

      - name: Export Godot web client
        run: |
          mkdir -p build/tankgame
          godot --headless --path godot/tankgame \
            --export-release "Web" "$GITHUB_WORKSPACE/build/tankgame/index.html"

      - name: Upload Godot web client
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tankgame-web
          path: build/tankgame

  build:
    name: Build
    needs: [export-godot, lint-godot]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: 'maven'

      - name: Download Godot web client
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tankgame-web
          path: src/main/resources/static/tankgame

      - name: Build design-system WebJar
        run: mvn -B -f design-system/pom.xml install -DskipTests

      - name: Run Maven verification
        run: mvn -B verify
