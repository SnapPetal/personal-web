name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: us-east-1
  AWS_DEPLOY_ROLE: arn:aws:iam::664759038511:role/GitHubActionsPersonalWebProdDeploy
  WEB_BUCKET: personal-site-thonbecker
  RELEASE_BUCKET: personal-site-releases-thonbecker
  CLOUDFRONT_DISTRIBUTION_ID: EIGIJWMOZIYVW

jobs:
  lint-godot:
    name: Lint GDScript
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install GDScript tooling
        run: python -m pip install --requirement requirements-godot.txt

      - name: Run GDScript lint and format checks
        run: scripts/lint-godot.sh

  export-godot:
    name: Export Godot tank game
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    env:
      GODOT_VERSION: 4.7.2

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
            ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Validate GDScript with Godot
        run: scripts/validate-godot.sh

      - name: Export Godot web client
        run: |
          mkdir -p build/tankgame
          godot --headless --path godot/tankgame \
            --export-release "Web" "$GITHUB_WORKSPACE/build/tankgame/index.html"

      - name: Upload Godot web client
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tankgame-web
          path: build/tankgame

  publish-static:
    name: Publish static site
    needs: export-godot
    runs-on: ubuntu-latest
    # OIDC subject is repo:SnapPetal/personal-web:environment:production.
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Godot web client
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tankgame-web
          path: site/tankgame

      - name: Assemble static site
        run: |
          set -euo pipefail
          cp -a static-site/. site/
          mkdir -p site/images
          cp src/main/resources/static/images/profile.png site/images/profile.png
          cp src/main/resources/static/images/favicon.svg site/images/favicon.svg
          test -f site/index.html
          test -f site/tankgame/index.html
          test -f site/images/profile.png
          test -f site/fonts/InterVariable.woff2
          test -f site/fonts/LICENSE.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: personalweb-static-site

      - name: Sync static site to S3
        run: |
          set -euo pipefail
          aws s3 sync site "s3://${WEB_BUCKET}" --delete --only-show-errors \
            --cache-control "public,max-age=300,must-revalidate"
          while IFS= read -r -d '' wasm; do
            key="${wasm#site/}"
            aws s3 cp "$wasm" "s3://${WEB_BUCKET}/${key}" \
              --content-type application/wasm \
              --cache-control "public,max-age=300,must-revalidate" \
              --only-show-errors
          done < <(find site/tankgame -type f -name '*.wasm' -print0)
          while IFS= read -r -d '' font; do
            key="${font#site/}"
            aws s3 cp "$font" "s3://${WEB_BUCKET}/${key}" \
              --content-type font/woff2 \
              --cache-control "public,max-age=31536000,immutable" \
              --only-show-errors
          done < <(find site/fonts -type f -name '*.woff2' -print0)

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

  release:
    name: Package and publish jar
    needs: [export-godot, lint-godot]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Download Godot web client
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tankgame-web
          path: src/main/resources/static/tankgame

      - name: Build design-system WebJar
        run: mvn -B -f design-system/pom.xml install -DskipTests

      # `mvn package` runs the test phase. Recent Pull Request runs of
      # `mvn -B verify` succeed on ubuntu-latest, including Testcontainers
      # and Playwright, so this release does not skip tests.
      - name: Package application
        run: mvn -B package

      - name: Write release jar and checksum
        run: |
          set -euo pipefail
          cp target/personal-1.0.0.jar personal-web.jar
          # The instance compares this file to its last install; keep it a bare hash.
          sha256sum personal-web.jar | cut -d' ' -f1 > personal-web.sha256
          cat personal-web.sha256

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: personalweb-jar-release

      - name: Upload jar and checksum
        run: |
          set -euo pipefail
          aws s3 cp personal-web.jar "s3://${RELEASE_BUCKET}/personal-web.jar" \
            --content-type application/java-archive \
            --cache-control "no-store" \
            --only-show-errors
          aws s3 cp personal-web.sha256 "s3://${RELEASE_BUCKET}/personal-web.sha256" \
            --content-type text/plain \
            --cache-control "no-store" \
            --only-show-errors
