name: Pull Request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-godot:
    name: Lint GDScript
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install GDScript tooling
        run: python -m pip install --requirement requirements-godot.txt

      - name: Run GDScript lint and format checks
        run: scripts/lint-godot.sh

  export-godot:
    name: Export Godot tank game
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    env:
      GODOT_VERSION: 4.7.2

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
            ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Validate GDScript with Godot
        run: scripts/validate-godot.sh

      - name: Export Godot web client
        run: |
          mkdir -p build/tankgame
          godot --headless --path godot/tankgame \
            --export-release "Web" "$GITHUB_WORKSPACE/build/tankgame/index.html"

      - name: Upload Godot web client
        uses: actions/upload-artifact@v7
        with:
          name: tankgame-web
          path: build/tankgame

  build:
    name: Build
    needs: [export-godot, lint-godot]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'maven'

      - name: Download Godot web client
        uses: actions/download-artifact@v8
        with:
          name: tankgame-web
          path: src/main/resources/static/tankgame

      - name: Build design-system WebJar
        run: mvn -B -f design-system/pom.xml install -DskipTests

      - name: Run Maven verification
        run: mvn -B verify
